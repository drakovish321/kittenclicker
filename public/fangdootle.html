<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FangDootle Browser</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #f0f0f0;
  }
  header {
    background: #4a90e2;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 1.5rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .search-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px;
  }
  .search-bar input {
    flex: 1;
    padding: 12px;
    font-size: 1rem;
    border: 2px solid #ddd;
    border-radius: 25px;
    max-width: 600px;
    outline: none;
  }
  .search-bar input:focus {
    border-color: #4a90e2;
  }
  .search-bar button {
    padding: 12px 25px;
    font-size: 1rem;
    border: none;
    background: #4a90e2;
    color: white;
    border-radius: 25px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .search-bar button:hover {
    background: #357abd;
  }
  #iframeContainer {
    flex: 1;
    width: 100%;
    height: 100%;
    border: none;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .gcse-search {
    display: none; /* hidden but still functional */
  }
  .about-link {
    text-align: center;
    margin: 10px;
    color: #4a90e2;
    text-decoration: none;
  }
  .about-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>FangDootle Browser</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Enter a website or search term...">
  <button id="searchBtn">Go</button>
</div>

<!-- Hidden Google Custom Search -->
<script async src="https://cse.google.com/cse.js?cx=b3ca3c210ee814d78"></script>
<div class="gcse-search"></div>

<iframe id="iframeContainer" src="https://www.google.com"></iframe>

<a href="/fangdootle/about.html" class="about-link">About Kitten Clicker →</a>

<script>
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const iframe = document.getElementById('iframeContainer');

function handleSearch() {
  let query = searchInput.value.trim();
  if (!query) return;

  // Redirect to Kitten Clicker if the query is cat related
  const lower = query.toLowerCase();
  if (lower.includes('kitten') || lower.includes('clicker') || lower.includes('kittens') || lower.includes('cat clicker')) {
    iframe.src = "https://kittenclicker.onrender.com";
    return;
  }

  // If user typed a full URL
  if (query.startsWith('http://') || query.startsWith('https://')) {
    iframe.src = query;
  } 
  else if (query.includes('.') && !query.includes(' ')) {
    // If it's a domain like "example.com"
    iframe.src = 'https://' + query;
  } 
  else {
    // Otherwise search using Google CSE
    iframe.src = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  }
}

searchBtn.addEventListener('click', handleSearch);
searchInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') handleSearch();
});
</script>

</body>
</html>
