<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FangDootle Browser</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-color: #eef4f8; /* Softer background */
    color: #333;
  }
  header {
    background: linear-gradient(to right, #6a82fb, #fc5c7d); /* Gradient header */
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 1.8rem;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    letter-spacing: 0.5px;
  }
  .search-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 30px 20px;
    flex-wrap: wrap; /* Allow wrapping on smaller screens */
  }
  .search-bar input {
    flex: 1;
    padding: 14px 20px;
    font-size: 1.05rem;
    border: 1px solid #cdd;
    border-radius: 30px;
    max-width: 650px;
    outline: none;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .search-bar input:focus {
    border-color: #6a82fb;
    box-shadow: 0 0 0 3px rgba(106, 130, 251, 0.2);
  }
  .search-bar button {
    padding: 14px 30px;
    font-size: 1.05rem;
    border: none;
    background: #6a82fb; /* Matching button color */
    color: white;
    border-radius: 30px;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .search-bar button:hover {
    background: #5267d3; /* Darker on hover */
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  #iframeWrapper {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 20px 20px; /* Padding around the iframe, more at bottom */
    box-sizing: border-box;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid #ddd;
    border-radius: 12px; /* More rounded corners */
    box-shadow: 0 8px 25px rgba(0,0,0,0.15); /* Stronger shadow for depth */
    background-color: white; /* Ensure iframe has a white background */
    transition: opacity 0.5s ease;
  }

  #welcomeMessage {
    position: absolute;
    text-align: center;
    color: #555;
    font-size: 1.2rem;
    line-height: 1.6;
    max-width: 500px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    z-index: 1; /* Above the iframe */
    transition: opacity 0.5s ease, transform 0.5s ease;
    transform: translateY(0);
  }

  #welcomeMessage h2 {
    color: #6a82fb;
    margin-top: 0;
    font-size: 2rem;
    font-weight: 600;
  }

  #welcomeMessage p {
    margin-bottom: 10px;
  }

  #welcomeMessage.hidden {
    opacity: 0;
    pointer-events: none; /* Make it unclickable when hidden */
    transform: translateY(20px);
  }

  .gcse-search {
    display: none; /* hidden but still functional */
  }
  .about-link {
    text-align: center;
    margin: 20px;
    color: #6a82fb; /* Matching link color */
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  .about-link:hover {
    text-decoration: underline;
    color: #5267d3;
  }
</style>
</head>
<body>

<header>FangDootle Browser</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Enter a website or search term...">
  <button id="searchBtn">Go</button>
</div>

<!-- Hidden Google Custom Search -->
<script async src="https://cse.google.com/cse.js?cx=b3ca3c210ee814d78"></script>
<div class="gcse-search"></div>

<div id="iframeWrapper">
  <div id="welcomeMessage">
    <h2>Welcome to FangDootle Browser!</h2>
    <p>Enter a URL (e.g., `example.com`) or a search term above to get started.</p>
    <p>Try searching for "kitten clicker" to discover a fun game!</p>
  </div>
  <iframe id="iframeContainer" src="about:blank"></iframe>
</div>

<a href="/fangdootle/about.html" class="about-link">About Kitten Clicker →</a>

<script>
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const iframe = document.getElementById('iframeContainer');
const welcomeMessage = document.getElementById('welcomeMessage');

function hideWelcomeMessage() {
  welcomeMessage.classList.add('hidden');
}

function showWelcomeMessage() {
  welcomeMessage.classList.remove('hidden');
}

function handleSearch() {
  let query = searchInput.value.trim();
  if (!query) {
    iframe.src = "about:blank"; // Reset iframe to blank
    showWelcomeMessage(); // Show welcome message if query is empty
    return;
  }

  hideWelcomeMessage(); // Hide welcome message when a search is performed

  // Redirect to Kitten Clicker if the query is cat related
  const lower = query.toLowerCase();
  if (lower.includes('kitten') || lower.includes('clicker') || lower.includes('kittens') || lower.includes('cat clicker')) {
    iframe.src = "https://kittenclicker.onrender.com";
    return;
  }

  // If user typed a full URL
  if (query.startsWith('http://') || query.startsWith('https://')) {
    iframe.src = query;
  }
  else if (query.includes('.') && !query.includes(' ')) {
    // If it's a domain like "example.com"
    iframe.src = 'https://' + query;
  }
  else {
    // Otherwise search using Google CSE (redirect to Google search results page)
    iframe.src = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  }
}

searchBtn.addEventListener('click', handleSearch);
searchInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') handleSearch();
});

// Listen for iframe load events to manage welcome message visibility
iframe.addEventListener('load', () => {
  // If the iframe loads something other than about:blank, hide the welcome message
  if (iframe.src !== "about:blank") {
    hideWelcomeMessage();
  } else {
    // If it loads about:blank (e.g., after a failed navigation or initial load), show it
    showWelcomeMessage();
  }
});

// Initially show the welcome message
showWelcomeMessage();
</script>

</body>
</html>
